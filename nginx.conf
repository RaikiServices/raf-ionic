# =============================================================================
# RAF - App joueur (PWA) servie par nginx.
#
# Le build de production appelle l'API sur la meme origine (apiUrl vide) : nginx
# sert la PWA et relaie /api au backend. Le navigateur ne voit qu'un seul site,
# donc pas de CORS.
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads (avatar, justificatifs) : au-dela, nginx refuserait avant le backend.
    client_max_body_size 10m;

    # En production, Caddy (raf-deploy/docker-compose.prod.yml) est devant nginx et transmet
    # l'IP du joueur dans X-Forwarded-For. Sans cette reprise, $remote_addr serait
    # celle de Caddy : tous les joueurs partageraient le meme plafond de
    # tentatives de connexion. Seules les adresses du reseau Docker sont crues.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # --- API -----------------------------------------------------------------
    # Le DNS de Docker est interroge a chaque requete (variable + resolver) :
    # nginx demarre meme si le backend n'est pas encore pret, et suit ses
    # redemarrages.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8081;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nginx est le point d'entree : il ecrase l'en-tete plutot que de
        # completer celui du client, qui pourrait sinon s'inventer une IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # --- Images televersees ------------------------------------------------------
    # Volume media-data, monte en lecture seule. Chaque fichier a un nom
    # aleatoire et n'est jamais reecrit : cache d'un an. nosniff : le navigateur
    # s'en tient au type deduit de l'extension (.jpg, .png).
    location ^~ /media/ {
        alias /usr/share/nginx/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # --- Fichiers que le navigateur doit toujours revalider --------------------
    # Le service worker decide des mises a jour a partir de ngsw.json : mis en
    # cache, les joueurs resteraient sur une ancienne version.
    location = /index.html            { add_header Cache-Control "no-cache"; }
    location = /ngsw.json             { add_header Cache-Control "no-cache"; }
    location = /ngsw-worker.js        { add_header Cache-Control "no-cache"; }
    location = /safety-worker.js      { add_header Cache-Control "no-cache"; }
    location = /worker-basic.min.js   { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest  { add_header Cache-Control "no-cache"; }

    # --- Fichiers du build, au nom hache : immuables ------------------------------
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- Routes de l'application -------------------------------------------------
    # /quiz/12 n'existe pas sur le disque : index.html laisse le routeur Angular
    # afficher la bonne page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
